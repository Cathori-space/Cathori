name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      migration_reviewed:
        description: '유지보수·구 서버 정지 및 001·002·003 전환이 승인됐음을 확인'
        type: boolean
        required: true
        default: false

concurrency:
  group: cathori-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.migration_reviewed
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/cathori-space/cathori-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Cathori-space/Cathori
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
          CATHORI_BACKEND_IMAGE: ghcr.io/cathori-space/cathori-backend@${{ steps.backend_image.outputs.digest }}
        with:
          host:     ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USER }}
          key:      ${{ secrets.WAS_SSH_KEY }}
          envs: RELEASE_SHA,CATHORI_BACKEND_IMAGE
          script: |
            set -e
            cd /home/${{ secrets.WAS_USER }}/Cathori

            git diff --exit-code --quiet
            git diff --cached --exit-code --quiet
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            bash backend/scripts/deploy-prod.sh
