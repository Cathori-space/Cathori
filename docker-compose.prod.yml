services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    container_name: cathori-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/cathori.crt:/etc/ssl/cathori.crt:ro
      - /etc/ssl/cathori.key:/etc/ssl/cathori.key:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cathori-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: cathori-backend
    env_file:
      - .env
    volumes:
      - ./secrets/cathori-firebase.json:/app/secrets/cathori-firebase.json:ro
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cathori-net

  db:
    image: postgres:16-alpine
    container_name: cathori-db
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cathori-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cathori-net

volumes:
  cathori-db-data:

networks:
  cathori-net:
    driver: bridge