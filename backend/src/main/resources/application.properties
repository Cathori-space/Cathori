spring.profiles.active=local
management.endpoints.web.exposure.include=health,metrics

# 이메일 인증 저장소 TTL (ISO-8601 Duration)
# codes:    인증번호 유효시간            — ADR D5
# verified: 인증 완료 상태 유효시간       — PRD F-04 (기존에는 만료가 없었다)
# send-log: 발송 이력 보관시간            — 1시간 윈도우 판정에 필요한 최소 보관
# 발송 한도·입력 횟수 제한 값은 해당 제한을 구현할 때 추가한다.
auth.email.code-ttl=PT3M
auth.email.verified-ttl=PT30M
auth.email.send-log-ttl=PT1H

# 인증번호 발송 한도 (ADR D2) — 이메일 하나당, purpose 무관. 슬라이딩 윈도우
# 시간당 한도를 세려면 send-log-ttl이 1시간보다 짧으면 안 된다
auth.email.send-limit-per-minute=3
auth.email.send-limit-per-hour=10

# 신규 가입 허용 도메인 (ADR D1) — @ 뒤와 정확히 일치(대소문자 포함). 콤마 구분
# allowed-addresses: 도메인과 무관하게 가입을 허용할 주소(심사용 계정 등). 기본 비움
auth.email.allowed-domains=catholic.ac.kr
auth.email.allowed-addresses=
