upstream backend {
    server backend:8080;  
    keepalive 32;
}


# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name cathori.site api.cathori.site;
    return 301 https://$host$request_uri;
}

# 인증번호 발송 IP 제한 (#215, ADR D2) — 서버의 이메일 단위 제한이 못 막는 "주소를 바꿔 가며 보내기"를 막는다.
# 발송 URL만 키를 갖고, 나머지 요청은 빈 키라 제한되지 않는다.
map $uri $email_send_limit_key {
    /api/auth/email/send   $binary_remote_addr;
    default                "";
}
limit_req_zone $email_send_limit_key zone=email_send:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name cathori.site api.cathori.site;
    server_tokens off;

    ssl_certificate     /etc/ssl/cathori.crt; # SSL/TLS 공개키(인증서) 경로 설정
    ssl_certificate_key /etc/ssl/cathori.key; # SSL/TLS 개인키 경로 설정
    ssl_protocols       TLSv1.2 TLSv1.3; # SSL/TLS 프로토콜 버전 설정 (보안 권장)
    ssl_ciphers         HIGH:!aNULL:!MD5; # 암호화 알고리즘 설정 (보안 권장)

    # CloudFlare 실제 클라이언트 IP 복원
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP; # 진짜 IP 꺼내기

    # nginx 헬스체크
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Spring Boot API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;

        # 발송 URL만 IP당 분당 10회 + 순간 5회 여유. 초과하면 서버 오류 응답과 같은 JSON으로 429
        # (10r/m은 6초마다 1회 회복 — Retry-After는 여유를 둬 10초)
        limit_req zone=email_send burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @email_send_limited;
    }

    location @email_send_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 10 always;
        return 429 '{"code":"EMAIL_SEND_TOO_FREQUENT","message":"잠시 후 다시 시도해 주세요","retryAfterSeconds":10}';
    }

    # 그 외 경로 차단 (앱 서버라 프론트 없음, 추후 html, css, js로 간단한 소개 페이지 구현 예정)
    location / {
        return 404;
    }
}