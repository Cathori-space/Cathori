name: Deploy to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'nginx/**'
      - 'prometheus/**'
      - 'grafana/**'
      - 'docker-compose.prod.yml'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/cathori-space/cathori-backend:latest
            ghcr.io/cathori-space/cathori-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Cathori-space/Cathori
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USER }}
          key:      ${{ secrets.WAS_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.WAS_USER }}/Cathori

            # 최신 코드 받기
            git pull origin main

            # 컨테이너 재빌드 + 재시작
            docker compose -f docker-compose.prod.yml up -d --build

            # 사용하지 않는 이미지 정리
            docker image prune -f