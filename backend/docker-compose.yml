services:
  db:
    image: postgres:16
    container_name: cathori-db
    environment:
      POSTGRES_DB: cathori
      POSTGRES_USER: cathori
      POSTGRES_PASSWORD: cathori1234
    ports:
      - "5432:5432"
    volumes:
      - cathori-db-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cathori-prometheus-local
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cathori-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: cathori-grafana-local
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cathori-spring-boot.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cathori-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  cathori-db-data:
  cathori-prometheus-data:
  cathori-grafana-data:
